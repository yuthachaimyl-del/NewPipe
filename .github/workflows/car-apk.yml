name: Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - car-ultrawide

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'
      - name: Build APK
        run: ./gradlew assembleContinuous --stacktrace -DskipFormatKtlint
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-car-apk
          path: app/build/outputs/apk/continuous/*.apk
